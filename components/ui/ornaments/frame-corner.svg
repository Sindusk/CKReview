<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Top-left panel corner; the other three corners mirror it with CSS
       transforms. At the 5px outward offset used by .ck-corner (see
       app/theme.css) the panel's 1px border runs along x/y 4 to 5, so:
       the legs are centred on that line and taper to exactly its width,
       fading out so they dissolve into the border instead of ending on
       top of it; the boss sits on the border intersection; the thin inner
       accent traces the panel's inset hairline (x/y 6.5 to 7).
       No double hyphens in this comment: they make the file invalid XML
       and it stops rendering. -->
  <defs>
    <radialGradient id="leg" cx="4.5" cy="4.5" r="19.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4dca0"/>
      <stop offset="0.3" stop-color="#d4a758"/>
      <stop offset="0.7" stop-color="#b98632" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#b98632" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accent" cx="6.8" cy="6.8" r="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8c77e" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e8c77e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e2ad"/>
      <stop offset="0.5" stop-color="#c0903e"/>
      <stop offset="1" stop-color="#6a4818"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe3ff"/>
      <stop offset="0.5" stop-color="#4f9be8"/>
      <stop offset="1" stop-color="#173a66"/>
    </linearGradient>
  </defs>
  <!-- tapered legs along the border line -->
  <path d="M2.6 2.6L24 4V5L6.4 6.4L5 24H4Z" fill="url(#leg)"/>
  <!-- inner accent along the inset hairline -->
  <path d="M8.5 6.75H18M6.75 8.5V18" stroke="url(#accent)" stroke-width="0.6" fill="none"/>
  <!-- boss on the border intersection, holding an arcane pip -->
  <path d="M4.5 0.4L8.6 4.5 4.5 8.6 0.4 4.5Z" fill="#070504"/>
  <path d="M4.5 1.4L7.6 4.5 4.5 7.6 1.4 4.5Z" fill="url(#boss)"/>
  <path d="M4.5 3.1L5.9 4.5 4.5 5.9 3.1 4.5Z" fill="url(#gem)" stroke="#070504" stroke-width="0.4"/>
</svg>
