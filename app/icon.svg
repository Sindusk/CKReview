<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Consistency Kings favicon: mark 2a ("Regal tilt") in its gilded hex frame,
    ported from the Claude Design project "Consistency Kings Logo".
    Flat fills and no chest/gem, matching that design's own favicon check —
    the shaded version muds up below ~32px.
    App Router picks this up automatically as the site icon.
  -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.6" stop-color="#c48f1c"/>
      <stop offset="1" stop-color="#6d4a0e"/>
    </linearGradient>
    <clipPath id="inner">
      <polygon points="50,3.85 96.15,24.15 96.15,64.77 50,96.15 3.85,64.77 3.85,24.15"/>
    </clipPath>
  </defs>

  <!-- gilded hex frame -->
  <polygon points="50,0 100,22 100,66 50,100 0,66 0,22" fill="url(#frame)"/>

  <g clip-path="url(#inner)">
    <rect x="0" y="0" width="100" height="100" fill="#100c09"/>

    <!-- head -->
    <circle cx="46" cy="62" r="27" fill="#fbf6ec"/>
    <!-- eye -->
    <circle cx="37.5" cy="54.5" r="4.5" fill="#17110e"/>
    <!-- bill -->
    <polygon points="66,56 95,60.68 95,64.58 66,69" fill="#e8a418"/>

    <!-- crown, cocked -8deg about the group centre -->
    <g transform="rotate(-8 46 16.5)">
      <polygon points="25.90,8.81 34.79,22.50 17.00,22.50" fill="#d8a422"/>
      <polygon points="46.00,4.00 54.90,22.50 37.11,22.50" fill="#e9b62c"/>
      <polygon points="66.10,8.81 75.00,22.50 57.21,22.50" fill="#d8a422"/>
      <rect x="15.26" y="22" width="61.48" height="6.5" fill="#e9b62c"/>
    </g>
  </g>
</svg>
